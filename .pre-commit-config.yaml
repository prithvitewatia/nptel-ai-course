# .pre-commit-config.yaml
repos:
  # Standard repository hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Official Ruff pre-commit hook
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # Use the latest Ruff version
    hooks:
      # 1. Run the linter and auto-fix safe issues (like unused imports)
      - id: ruff-check
        args: [ --fix ]

      # 2. Run the formatter to enforce code style consistency
      - id: ruff-format
